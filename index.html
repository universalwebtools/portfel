<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wspólny Portfel Offline v5</title>
<style>
:root{font:15px Arial;color:#17231e;background:#f4f6f3;--g:#1e6f50;--d:#173f31;--l:#dfe7e2;--r:#d8694c}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:white;border-right:1px solid var(--l);padding:28px 18px;position:sticky;top:0;height:100vh}.logo{font-size:21px;font-weight:800;margin:0 12px 42px;color:var(--d)}nav{display:grid;gap:8px}nav button{border:0;background:none;padding:14px;text-align:left;border-radius:12px;font-weight:700;color:#66716a}nav button.active,nav button:hover{background:#e9f4ed;color:var(--g)}main{padding:34px 42px 110px;min-width:0}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}h1,h2{margin:0}.muted,small{color:#748079}.month{border:1px solid var(--l);background:white;border-radius:12px;padding:12px 18px}.hero{background:linear-gradient(135deg,#14382c,#1e6047);color:white;border-radius:24px;padding:32px;display:grid;gap:8px}.hero strong{font-size:38px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}.card,.panel{background:white;border:1px solid var(--l);border-radius:18px;padding:22px}.card b{font-size:22px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.row{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #edf0ed}.row:last-child{border:0}.row b,.row small{display:block}.income{color:var(--g)}.expense{color:var(--r)}.primary{background:var(--g)!important;color:white;border:0!important}.actions{position:fixed;right:25px;bottom:24px;display:flex;gap:8px}.actions button,.btn{border:1px solid var(--l);background:white;border-radius:11px;padding:12px 16px;font-weight:700}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px;margin:18px 0}.filters input,.filters select,input,select{width:100%;padding:11px;border:1px solid #cad3cd;border-radius:10px;background:white}.overlay{position:fixed;inset:0;background:#10201899;display:grid;place-items:center;padding:14px;z-index:20}.modal{background:white;width:min(600px,100%);max-height:94vh;overflow:auto;border-radius:20px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{border:0;background:none;font-size:25px}.form{display:grid;gap:14px}.form label{display:grid;gap:6px;font-weight:700}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#eef2ef;padding:5px;border-radius:12px}.switch button{border:0;padding:10px;border-radius:9px}.switch .active{background:white;color:var(--g)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{padding:20px 8px;border:1px solid var(--l);border-radius:13px;background:#f8faf8}.tag{display:inline-flex;gap:5px;background:#e8f3ec;border-radius:99px;padding:8px 10px;margin:4px}.tag button{border:0;background:none}.settings{display:grid;grid-template-columns:1fr 1fr;gap:18px}.settings form{display:flex;gap:8px;margin:16px 0}.summary-table{width:100%;border-collapse:collapse}.summary-table td,.summary-table th{padding:11px;text-align:right;border-bottom:1px solid var(--l)}.summary-table td:first-child,.summary-table th:first-child{text-align:left}.bars{display:flex;align-items:end;gap:8px;height:240px;padding-top:20px}.bar{flex:1;display:grid;grid-template-rows:1fr auto;gap:6px;height:100%;align-items:end;text-align:center}.bar i{display:block;background:var(--g);border-radius:5px 5px 0 0;min-height:2px}.toast{position:fixed;right:20px;top:20px;background:var(--d);color:white;padding:14px;border-radius:12px;z-index:30}.hidden{display:none!important}.photo{max-width:100%;max-height:260px;object-fit:contain;background:#eee;border-radius:12px}.split-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
@media(max-width:760px){.app{display:block}aside{height:auto;position:fixed;inset:auto 0 0;z-index:10;padding:6px}aside .logo{display:none}aside nav{grid-template-columns:repeat(4,1fr)}aside nav button{text-align:center;padding:10px 3px;font-size:11px}main{padding:20px 14px 90px}.cards,.grid,.settings{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.actions{position:static;display:grid;grid-template-columns:1fr 1fr;margin-top:18px}.cols{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}header{display:grid;gap:12px}.month{width:100%}.row{grid-template-columns:1fr auto}.row .minor{display:none}}
</style><link rel="stylesheet" href="ing-theme.css"></head><body><div class="app"><aside><div class="logo">◉ Wspólny Portfel</div><nav id="nav"><button data-tab="home" class="active">Pulpit</button><button data-tab="transactions">Transakcje</button><button data-tab="summary">Podsumowanie</button><button data-tab="settings">Ustawienia</button></nav></aside><main><header><div><h1 id="title">Dzień dobry!</h1><div class="muted">Wspólny budżet Rafała i Klaudii · offline</div></div><button class="month" id="monthBtn"></button></header><div id="view"></div></main></div><div id="modal"></div><div id="toast"></div>
<script>
const cats0=['Zakupy spożywcze','Jedzenie na mieście','Rachunki i media','Dom i ogród','Dziecko','Auto i paliwo','Zdrowie i apteka','Ubrania','Kosmetyki','Rozrywka','Wyjazdy i wakacje','Prezenty','Ubezpieczenia','Raty i kredyty','Zwierzęta','Inne'],inc0=['Wypłata','Premia','Dodatkowe zlecenie','Zwrot pieniędzy','Sprzedaż rzeczy','Inny przychód'],seed=[];let S={items:load('wpo30app-items',seed),trash:load('wpo30app-trash',[]),logs:load('wpo30app-logs',[]),cats:load('wpo30app-cats',cats0),incs:load('wpo30app-incs',inc0),month:'2026-08',tab:'home'};function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function persist(){['items','trash','logs','cats','incs'].forEach(k=>localStorage.setItem('wpo30app-'+k,JSON.stringify(S[k])))}const cash=n=>Number(n||0).toLocaleString('pl-PL',{style:'currency',currency:'PLN'}),uid=()=>crypto.randomUUID(),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),sum=a=>({income:a.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),expense:a.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)});function log(t){S.logs.unshift({id:uid(),at:new Date().toISOString(),text:t});S.logs=S.logs.slice(0,300)}function current(){return S.items.filter(x=>x.date.startsWith(S.month))}function rows(a,buttons=false){return a.length?a.map(x=>`<div class="row"><div><b>${x.photo?'📷 ':''}${esc(x.merchant||x.description||x.category)}</b><small>${esc(x.category)} · ${x.date} · ${x.person}${x.split?' · część paragonu':''}</small></div><strong class="${x.type}">${x.type==='income'?'+':'−'}${cash(x.amount)}</strong>${buttons?`<button class="btn minor" onclick="editTx('${x.id}')">Edytuj</button><button class="btn minor" onclick="removeTx('${x.id}')">Usuń</button>`:''}</div>`).join(''):'<p class="muted">Brak transakcji.</p>'}function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.tab));document.querySelector('#title').textContent={home:'Dzień dobry!',transactions:'Transakcje',summary:'Podsumowanie',settings:'Ustawienia'}[S.tab];document.getElementById('monthBtn').textContent=new Date(S.month+'-01T12:00').toLocaleDateString('pl-PL',{month:'long',year:'numeric'});document.getElementById('view').innerHTML=S.tab==='home'?home():S.tab==='transactions'?transactions():S.tab==='summary'?summary():settings();persist()}function home(){let a=current(),z=sum(a),bal=z.income-z.expense,c={};a.filter(x=>x.type==='expense').forEach(x=>c[x.category]=(c[x.category]||0)+x.amount);return `<section class="hero"><small>DOSTĘPNE W TYM MIESIĄCU</small><strong>${cash(bal)}</strong><span>${bal>=0?'Budżet jest na plusie':'Wydatki przekroczyły przychody'}</span></section><div class="cards"><div class="card"><small>PRZYCHODY</small><br><b class="income">${cash(z.income)}</b></div><div class="card"><small>WYDATKI</small><br><b class="expense">${cash(z.expense)}</b></div><div class="card"><small>TRANSAKCJE</small><br><b>${a.length}</b></div></div><div class="grid"><section class="panel"><h2>Ostatnie transakcje</h2>${rows(a.slice().sort((x,y)=>y.date.localeCompare(x.date)).slice(0,6))}</section><section class="panel"><h2>Największe kategorie</h2>${Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,7).map(x=>`<p><b>${esc(x[0])}</b><span style="float:right">${cash(x[1])}</span></p>`).join('')||'<p class="muted">Brak wydatków.</p>'}</section></div><div class="actions"><button class="primary" onclick="txModal('expense')">+ Dodaj wydatek</button><button onclick="quick()">Szybki wydatek</button><button onclick="txModal('income')">+ Dodaj przychód</button><button onclick="scan()">📷 Paragon</button></div>`}function transactions(){return `<section class="panel"><div style="display:flex;justify-content:space-between"><div><h2>Wszystkie operacje</h2><p class="muted" id="count"></p></div><button class="btn primary" onclick="txModal('expense')">+ Dodaj</button></div><div class="filters"><input id="q" placeholder="Szukaj sklepu, opisu lub kwoty"><select id="ft"><option value="">Wszystkie typy</option><option value="expense">Wydatki</option><option value="income">Przychody</option></select><select id="fc"><option value="">Wszystkie kategorie</option>${S.cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="fp"><option value="">Obie osoby</option><option>Rafał</option><option>Klaudia</option></select></div><div id="txRows"></div></section>`}function filter(){let q=document.querySelector('#q')?.value.toLowerCase()||'',t=document.querySelector('#ft')?.value||'',c=document.querySelector('#fc')?.value||'',p=document.querySelector('#fp')?.value||'',a=current().filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!t||x.type===t)&&(!c||x.category===c)&&(!p||x.person===p));document.getElementById('txRows').innerHTML=rows(a,true);document.getElementById('count').textContent=a.length+' z '+current().length+' pozycji'}function summary(){let a=current(),z=sum(a),d=new Date(S.month+'-01'),pm=new Date(d.getFullYear(),d.getMonth()-1,1).toISOString().slice(0,7),p=sum(S.items.filter(x=>x.date.startsWith(pm))),big=a.filter(x=>x.type==='expense').sort((x,y)=>y.amount-x.amount).slice(0,10),annual=Array.from({length:12},(_,i)=>sum(S.items.filter(x=>x.date.startsWith(d.getFullYear()+'-'+String(i+1).padStart(2,'0'))))),mx=Math.max(1,...annual.map(x=>x.expense));return `<div class="cards"><div class="card"><small>PRZYCHODY</small><br><b>${cash(z.income)}</b></div><div class="card"><small>WYDATKI</small><br><b>${cash(z.expense)}</b></div><div class="card"><small>BILANS</small><br><b>${cash(z.income-z.expense)}</b></div></div><div class="grid"><section class="panel"><h2>Porównanie miesięcy</h2><table class="summary-table"><tr><th></th><th>Poprzedni</th><th>Obecny</th><th>Zmiana</th></tr>${[['Przychody',p.income,z.income],['Wydatki',p.expense,z.expense],['Bilans',p.income-p.expense,z.income-z.expense]].map(x=>`<tr><td>${x[0]}</td><td>${cash(x[1])}</td><td>${cash(x[2])}</td><td>${x[1]?Math.round((x[2]-x[1])/Math.abs(x[1])*100)+'%':'—'}</td></tr>`).join('')}</table></section><section class="panel"><h2>10 największych wydatków</h2>${rows(big)}</section><section class="panel" style="grid-column:1/-1"><h2>Wydatki w roku ${d.getFullYear()}</h2><div class="bars">${annual.map((x,i)=>`<div class="bar"><i style="height:${x.expense/mx*100}%"></i><small>${i+1}</small></div>`).join('')}</div></section></div>`}function editor(title,key){return `<section class="panel"><h2>${title}</h2><form onsubmit="addSetting(event,'${key}')"><input name="n" placeholder="Nowa pozycja" required><button class="btn primary">Dodaj</button></form><div>${S[key].map(x=>`<span class="tag">${esc(x)} <button onclick="delSetting('${key}','${encodeURIComponent(x)}')">×</button></span>`).join('')}</div></section>`}function settings(){return `<div class="settings"><section class="panel"><h2>Domownicy</h2><p><b>Rafał</b><br><small>Wspólny budżet</small></p><p><b>Klaudia</b><br><small>Wspólny budżet</small></p></section><section class="panel"><h2>Dane offline</h2><p class="muted">Dane i zdjęcia są zapisane tylko w tej przeglądarce.</p><button class="btn" onclick="historyModal()">Historia zmian</button> <button class="btn" onclick="trashModal()">Kosz (${S.trash.length})</button></section>${editor('Kategorie wydatków','cats')}${editor('Rodzaje przychodów','incs')}</div>`}function openModal(title,body){document.getElementById('modal').innerHTML=`<div class="overlay"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}function closeModal(){document.getElementById('modal').innerHTML=''}function suggest(s){s=s.toLowerCase();let r=[[['lidl','biedronka','kaufland','aldi','żabka'],'Zakupy spożywcze'],[['orlen','bp','shell','moya'],'Auto i paliwo'],[['rossmann','hebe'],'Kosmetyki'],[['apteka','doz'],'Zdrowie i apteka'],[['ikea','leroy','castorama','obi'],'Dom i ogród'],[['kfc','mcdonald','restaur','pizzeria'],'Jedzenie na mieście']];return(r.find(x=>x[0].some(k=>s.includes(k)))||[0,S.cats[0]])[1]}function txModal(type='expense',id='',preset={}){let x=S.items.find(i=>i.id===id)||{type,date:new Date().toISOString().slice(0,10),person:'Rafał',...preset};openModal(id?'Edytuj transakcję':'Nowa transakcja',`<form class="form" id="txForm" onsubmit="saveTx(event,'${id}')"><div class="switch"><button type="button" id="ex" onclick="switchType('expense')" class="${x.type==='expense'?'active':''}">Wydatek</button><button type="button" id="incBtn" onclick="switchType('income')" class="${x.type==='income'?'active':''}">Przychód</button></div><input type="hidden" name="type" value="${x.type}"><label>Kwota<input required name="amount" inputmode="decimal" value="${x.amount||''}"></label><div class="cols"><label>Data<input required type="date" name="date" value="${x.date}"></label><label id="categoryLabel"></label></div><div id="expenseFields"></div><label>${x.type==='income'?'Kto otrzymał':'Kto zapłacił'}<select name="person"><option ${x.person==='Rafał'?'selected':''}>Rafał</option><option ${x.person==='Klaudia'?'selected':''}>Klaudia</option></select></label><input type="hidden" name="photo" value="${x.photo||''}">${x.photo?`<img class="photo" src="${x.photo}">`:''}<button class="btn primary">Zapisz</button></form>`);switchType(x.type,x)}function switchType(t,x={}){let f=document.getElementById('txForm');f.elements.type.value=t;document.getElementById('ex').classList.toggle('active',t==='expense');document.getElementById('incBtn').classList.toggle('active',t==='income');document.getElementById('categoryLabel').innerHTML=t==='income'?`Rodzaj przychodu<select name="category">${S.incs.map(c=>`<option ${c===x.category?'selected':''}>${esc(c)}</option>`).join('')}</select>`:`Kategoria<select name="category">${S.cats.map(c=>`<option ${c===x.category?'selected':''}>${esc(c)}</option>`).join('')}</select>`;document.getElementById('expenseFields').innerHTML=t==='expense'?`<label>Sklep / miejsce<input name="merchant" value="${esc(x.merchant||'')}" oninput="this.form.category.value=suggest(this.value)" placeholder="np. Lidl — kategoria ustawi się sama"></label><label>Opis<input name="description" value="${esc(x.description||'')}"></label><label><input type="checkbox" name="split" onchange="document.getElementById('splitBox').classList.toggle('hidden',!this.checked)"> Podziel paragon na kategorie</label><div id="splitBox" class="hidden"><div id="parts"></div><button class="btn" type="button" onclick="addPart()">+ Dodaj część</button></div>`:''}function addPart(){document.getElementById('parts').insertAdjacentHTML('beforeend',`<div class="split-row"><select class="pc">${S.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input class="pa" inputmode="decimal" placeholder="Kwota części"></div>`)}function saveTx(e,id){e.preventDefault();let f=e.target,d=new FormData(f),amount=Number(String(d.get('amount')).replace(',','.')),base={id:id||uid(),type:d.get('type'),amount,date:d.get('date'),category:d.get('category'),description:d.get('type')==='income'?d.get('category'):d.get('description'),merchant:d.get('type')==='income'?'':d.get('merchant'),person:d.get('person'),photo:d.get('photo')||''};if(d.get('split')){let ps=[...document.querySelectorAll('.split-row')].map(r=>({category:r.querySelector('.pc').value,amount:Number(r.querySelector('.pa').value.replace(',','.'))})),total=ps.reduce((s,x)=>s+x.amount,0);if(Math.abs(total-amount)>.01)return alert('Suma części '+cash(total)+' musi być równa '+cash(amount));let g=uid();ps.forEach(p=>S.items.unshift({...base,id:uid(),category:p.category,amount:p.amount,split:g}));log('Rafał podzielił paragon '+(base.merchant||'')+' na '+ps.length+' części')}else{let old=S.items.find(x=>x.id===id);if(old)S.items=S.items.map(x=>x.id===id?base:x);else S.items.unshift(base);log(old?'Rafał edytował '+(base.merchant||base.category)+': '+cash(old.amount)+' → '+cash(base.amount):'Rafał dodał '+(base.merchant||base.category)+': '+cash(base.amount))}closeModal();render()}function editTx(id){txModal('',id)}function removeTx(id){let x=S.items.find(i=>i.id===id);S.items=S.items.filter(i=>i.id!==id);S.trash.unshift({item:x,deletedAt:new Date().toISOString()});log('Rafał przeniósł do kosza: '+(x.merchant||x.category));document.getElementById('toast').innerHTML='<div class="toast" onclick="undo()">Przeniesiono do kosza — kliknij, aby cofnąć</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',5000);render()}function undo(){let d=S.trash.shift();if(d)S.items.unshift(d.item);document.getElementById('toast').innerHTML='';render()}function quick(){openModal('Szybki wydatek',`<div class="quick">${[['Lidl','Zakupy spożywcze'],['Biedronka','Zakupy spożywcze'],['Orlen','Auto i paliwo'],['Apteka','Zdrowie i apteka'],['Rossmann','Kosmetyki'],['Allegro','Inne']].map(x=>`<button onclick="txModal('expense','',{merchant:'${x[0]}',category:'${x[1]}'})"><b>${x[0]}</b><br><small>${x[1]}</small></button>`).join('')}</div>`)}function scan(){openModal('Dodaj zdjęcie paragonu',`<div class="form"><p class="muted">Zdjęcie zostanie zapisane wyłącznie na tym urządzeniu.</p><input type="file" accept="image/*" capture="environment" onchange="photo(event)"><div id="photoPreview"></div></div>`)}function photo(e){let f=e.target.files[0],r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let max=1400,scale=Math.min(1,max/im.width),c=document.createElement("canvas");c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);let data=c.toDataURL("image/jpeg",.72);photoPredocument.getElementById('view').innerHTML=`<img class="photo" src=""><button class="btn primary" onclick="txModal('expense','',{photo:''})">Wpisz dane paragonu</button>`};im.src=r.result};r.readAsDataURL(f)}function addSetting(e,k){e.preventDefault();let n=new FormData(e.target).get('n').trim();if(n&&!S[k].some(x=>x.toLowerCase()===n.toLowerCase()))S[k].push(n);render()}function delSetting(k,n){n=decodeURIComponent(n);if(S[k].length>1)S[k]=S[k].filter(x=>x!==n);render()}function historyModal(){openModal('Historia zmian',S.logs.length?S.logs.map(x=>`<p><b>${esc(x.text)}</b><br><small>${new Date(x.at).toLocaleString('pl-PL')}</small></p>`).join(''):'<p>Brak zmian.</p>')}function trashModal(){openModal('Kosz',S.trash.length?S.trash.map(x=>`<div class="row"><div><b>${esc(x.item.merchant||x.item.category)}</b><small>${new Date(x.deletedAt).toLocaleString('pl-PL')}</small></div><b>${cash(x.item.amount)}</b><button class="btn" onclick="restore('${x.item.id}')">Przywróć</button></div>`).join(''):'<p>Kosz jest pusty.</p>')}function restore(id){let d=S.trash.find(x=>x.item.id===id);S.trash=S.trash.filter(x=>x.item.id!==id);S.items.unshift(d.item);log('Rafał przywrócił: '+(d.item.merchant||d.item.category));closeModal();render()}document.querySelector('#nav').onclick=e=>{if(e.target.dataset.tab){S.tab=e.target.dataset.tab;render();if(S.tab==='transactions')setTimeout(filter)}};document.addEventListener('input',e=>{if(['q','ft','fc','fp'].includes(e.target.id))filter()});document.getElementById('monthBtn').onclick=()=>openModal('Wybierz miesiąc',`<input type="month" id="monthPick" value="${S.month}"><button class="btn primary" style="margin-top:12px" onclick="S.month=document.getElementById('monthPick').value;closeModal();render()">Przejdź</button>`);render();
</script><script src="enhancements.js"></script></body></html>
